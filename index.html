<style>
/* 1. Blogger Default Elements Hide */
#navbar-iframe, .header-widget, .Header, .title-wrapper, .mobile-header, header,
.date-header, .date-outer, .post-title, .post-header, .post-share-buttons, 
.post-labels, .comments, #comments, .mobile-top, .search, .mobile-search, .blog-pager,
.bg-photo, .bg-photo-overlay, .body-bg, .body-background {
    display: none !important;
}

/* 2. Remove Blogger Page Margin & Scroll */
html, body {
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    background: #0c0a17 !important;
}

/* 3. Full-Screen Fixed Overlay */
.fixed-support-wrapper {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    background: radial-gradient(circle at 50% 0%, #1e1338 0%, #0c0a17 65%, #05040a 100%) !important;
    z-index: 99999999 !important;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    padding: 40px 16px 80px 16px !important;
    box-sizing: border-box !important;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
}

/* WECOIN LOGO HEADER */
.logo-container {
    margin-bottom: 25px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
}

.safe-pill-badge {
    background-color: #000000;
    display: inline-flex;
    align-items: center;
    padding: 10px 22px;
    border-radius: 12px;
    gap: 12px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.safe-text {
    color: #ffffff;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 1px;
    font-family: 'Arial Black', Impact, sans-serif;
    text-transform: uppercase;
}

.safe-yellow-box {
    background-color: #fff01f;
    color: #000000;
    font-size: 22px;
    font-weight: 900;
    padding: 3px 12px;
    border-radius: 7px;
    font-family: 'Arial Black', Impact, sans-serif;
    text-transform: uppercase;
}

/* Glassmorphism Form Card */
.form-card { 
    width: 100%; 
    max-width: 460px; 
    box-sizing: border-box;
    background: rgba(22, 18, 38, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 22px;
    padding: 26px 20px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
}

.card-title {
    text-align: center;
    color: #ffffff;
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 20px;
}

.card-title span { color: #fff01f; }

.input-group { margin-bottom: 16px; }

.input-group label { 
    display: block;
    margin-bottom: 7px; 
    font-size: 13px; 
    color: #a5a1bb; 
    font-weight: 600; 
}

.input-group input, .input-group select {
    width: 100%; 
    padding: 14px 15px; 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    border-radius: 12px; 
    background: #0f0c1c; 
    color: #ffffff; 
    font-size: 15px; 
    outline: none; 
    box-sizing: border-box;
}

.input-group input:focus, .input-group select:focus {
    border-color: #fff01f; 
    box-shadow: 0 0 0 3px rgba(255, 240, 31, 0.18); 
}

.input-group select { cursor: pointer; }
.input-group select option { background-color: #0f0c1c; color: #ffffff; }

.row { display: flex; flex-direction: column; }
.row .input-group { margin-bottom: 16px; }

@media (min-width: 480px) {
    .row { flex-direction: row; gap: 12px; }
    .row .input-group { flex: 1; margin-bottom: 16px; }
}

/* Submit Button */
.btn-submit {
    width: 100%; 
    display: block; 
    margin-top: 10px; 
    padding: 16px;
    background: #fff01f; 
    color: #000000; 
    border: none; 
    border-radius: 14px;
    font-size: 16px; 
    font-weight: 900; 
    cursor: pointer; 
    box-shadow: 0 8px 25px rgba(255, 240, 31, 0.25);
    text-transform: uppercase;
}

.btn-submit:hover { filter: brightness(1.05); }
.btn-submit:disabled { background: #555; color: #aaa; cursor: not-allowed; box-shadow: none; }

/* Telegram Links Section */
.tg-link-container { 
    text-align: center; 
    margin-top: 22px; 
    padding-top: 16px; 
    border-top: 1px solid rgba(255, 255, 255, 0.08); 
}

.tg-link-container p { color: #8c88a6; font-size: 13px; margin-bottom: 12px; }

.tg-buttons-wrapper {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.tg-btn {
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
    gap: 6px;
    background: rgba(42, 171, 238, 0.12);
    border: 1px solid rgba(42, 171, 238, 0.3);
    color: #55c0ff; 
    text-decoration: none; 
    padding: 10px 14px;
    border-radius: 50px; 
    font-weight: 700; 
    font-size: 12px;
    flex: 1;
}

.tg-btn.secondary {
    background: rgba(34, 197, 94, 0.12);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #4ade80;
}

.tg-btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

/* Status Modal */
.modal-overlay {
    display: none; 
    position: fixed; 
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85); 
    z-index: 999999999 !important; 
    justify-content: center; 
    align-items: center; 
    padding: 20px;
}

.modal-box {
    background: #151124; 
    padding: 30px 24px; 
    border-radius: 20px; 
    text-align: center; 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    max-width: 320px; 
    width: 100%;
}

.icon-circle { 
    width: 60px; height: 60px; border-radius: 50%; 
    display: flex; align-items: center; justify-content: center; 
    margin: 0 auto 14px auto; 
    background: rgba(34, 197, 94, 0.12); 
    border: 2px solid #22c55e; color: #22c55e; 
}

.icon-circle svg { width: 30px; height: 30px; stroke-width: 2.5; }
.modal-box h3 { color: #ffffff; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.modal-box p { font-size: 14px; color: #9d99b5; margin-bottom: 20px; }

.btn-close { 
    background: #fff01f; color: #000000; border: none; 
    padding: 12px 36px; border-radius: 50px; 
    font-size: 14px; font-weight: 800; cursor: pointer; 
}
</style>

<div class="fixed-support-wrapper">
    <!-- WECOIN LOGO HEADER -->
    <div class="logo-container">
        <div class="safe-pill-badge">
            <span class="safe-text">WE</span>
            <span class="safe-yellow-box">COIN</span>
        </div>
    </div>
    
    <div class="form-card">
        <div class="card-title">Priority <span>Support</span> Desk</div>

        <form id="supportForm">
            <div class="input-group">
                <label for="email">User Email</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="10 Digit Number" pattern="[0-9]{10}" required>
                </div>
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Your Name" required>
                </div>
            </div>

            <div class="input-group">
                <label for="problem">Select Issue Type</label>
                <select id="problem" required>
                    <option value="" disabled selected>Choose your issue...</option>
                    <option value="Withdrawal Problem">Withdrawal Problem</option>
                    <option value="Deposit Problem">Deposit Problem</option>
                    <option value="Profile Update">Profile Update</option>
                    <option value="Bonus Issue">Bonus Issue</option>
                    <option value="Email Verify">Email Verify</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Request</button>
        </form>

        <div class="tg-link-container">
            <p>Need urgent assistance?</p>
            <div class="tg-buttons-wrapper">
                <!-- Pehla Telegram Link -->
                <a href="https://t.me/Helpcare24" target="_blank" class="tg-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.211-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.458c.538-.196 1.006.128.832.941z"/></svg>
                    Telegram 1
                </a>
                <!-- Doosra Telegram Link (Apna actual link yahan daal dein) -->
                <a href="https://t.me/YahanDoosraUsername" target="_blank" class="tg-btn secondary">
                    <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.211-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.458c.538-.196 1.006.128.832.941z"/></svg>
                    Telegram 2
                </a>
            </div>
        </div>
    </div>
</div>

<div id="statusModal" class="modal-overlay">
    <div class="modal-box">
        <div id="modalIcon" class="icon-circle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h3 id="modalTitle">Request Sent!</h3>
        <p id="statusText">Aapki request team ko bhej di gayi hai.</p>
        <button class="btn-close" id="closeModalBtn">Continue</button>
    </div>
</div>

<script>
    // Configured with your new Bot Token and Chat ID
    const BOT_TOKEN = "9141921713:AAGkN8GzYAMZRmf_mTIYoGN-1fi9E6Pr40w";
    const CHAT_ID = "9245884350";

    const form = document.getElementById('supportForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusModal = document.getElementById('statusModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    closeModalBtn.addEventListener('click', () => { statusModal.style.display = 'none'; });

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        submitBtn.innerText = "Processing...";
        submitBtn.disabled = true;

        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const name = document.getElementById('name').value.trim();
        const problem = document.getElementById('problem').value;

        // Telegram Message Format
        const message = "🪙 *New Wecoin Support Request*\n\n" +
                        "✉️ *Email:* " + email + "\n" +
                        "👤 *Name:* " + name + "\n" +
                        "📞 *Phone:* " + phone + "\n" +
                        "⚠️ *Issue:* " + problem;

        const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage";

        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: "Markdown"
            })
        })
        .then(res => res.json())
        .then(data => {
            if(data.ok) {
                statusModal.style.display = "flex";
                form.reset();
            } else {
                alert("Error: " + data.description);
            }
        })
        .catch(err => {
            console.error(err);
            alert("Network error. Please try again.");
        })
        .finally(() => {
            submitBtn.innerText = "Submit Request";
            submitBtn.disabled = false;
        });
    });
</script>
